services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prospecta
      POSTGRES_PASSWORD: prospecta
      POSTGRES_DB: prospecta
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospecta"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8100:8000"]   # host 8100 -> container 8000 (8000 is in a Windows reserved port range)
    volumes: ["./backend:/app"]

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app.celery worker --loglevel=info
    env_file: ./backend/.env
    depends_on:
      redis: { condition: service_started }
    volumes: ["./backend:/app"]

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8100
      # Dev-only: this machine is behind an SSL-intercepting proxy that breaks Next's
      # runtime download of the native SWC binary. Trust the leaf cert so Node can fetch it.
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on: [backend]
    ports: ["3000:3000"]
    volumes: ["./frontend:/app", "/app/node_modules"]

volumes:
  pgdata:
