[project]
name = "prospecta-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.0",  # passlib 1.7.x is incompatible with bcrypt 4+ (72-byte probe error)
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "phonenumbers>=8.13",
    "httpx>=0.27",
    "celery>=5.4",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
